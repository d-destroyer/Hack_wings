<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Tile Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-item">

                </svg>
            </div>
            <span class="nav-label">Profile</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon settings-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </div>
            <span class="nav-label">Settings</span>
        </div>
    </nav>
    <h1 class="brand-title">WINGS : <span class="brand-subtitle">FROM ASTHETIC TO AUTHENTIC</span></h1>
    <div class="carousel-container">
        <div class="carousel">
            <div class="slide">
                <div class="tile tile1">Home</div>
            </div>
            <div class="slide">
                <div class="tile tile2">Entertainment</div>
            </div>
            <div class="slide">
                <div class="tile tile3">Chat</div>
            </div>
            <div class="slide">
                <div class="tile tile4">Thoughts</div>
            </div>
            <div class="slide">
                <div class="tile tile5">Profile</div>
            </div>
        </div>
    </div>
</body>
</html>
