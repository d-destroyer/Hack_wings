<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WINGS 🪽 | Messaging</title>
<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    height: 100vh;
    overflow: hidden;
    color: #fff;
  }

  /* Sidebar - Conversations */
  .sidebar {
    width: 300px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    display: flex;
    flex-direction: column;
    padding: 15px;
    box-shadow: 2px 0 15px rgba(0,0,0,0.3);
  }

  .sidebar h2 {
    margin: 0 0 20px;
    color: #7ee9ff;
    text-align: center;
    letter-spacing: 1px;
  }

  .conversation {
    padding: 12px 10px;
    border-radius: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: 0.2s background;
    display: flex;
    align-items: center;
  }
  .conversation:hover {
    background: rgba(255,255,255,0.1);
  }
  .conversation img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-right: 10px;
    object-fit: cover;
  }
  .conversation .name {
    font-weight: bold;
    font-size: 1em;
  }
  .conversation .lastMsg {
    font-size: 0.85em;
    opacity: 0.7;
  }

  /* Chat area */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(10px);
    padding: 20px;
  }

  .chat-header {
    height: 60px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 10px;
  }
  .chat-header img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    margin-right: 12px;
  }
  .chat-header .name {
    font-size: 1.2em;
    font-weight: bold;
  }

  .messages {
    flex: 1;
    padding: 20px 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .message {
    max-width: 60%;
    padding: 10px 15px;
    border-radius: 20px;
    word-wrap: break-word;
    line-height: 1.3;
  }

  .message.sent {
    background: rgba(126,233,255,0.8);
    color: #0f2027;
    align-self: flex-end;
    border-bottom-right-radius: 2px;
  }

  .message.received {
    background: rgba(255,255,255,0.1);
    align-self: flex-start;
    border-bottom-left-radius: 2px;
  }

  .input-area {
    display: flex;
    margin-top: 10px;
  }
  .input-area input {
    flex: 1;
    padding: 12px 15px;
    border-radius: 25px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.05);
    color: #fff;
  }
  .input-area button {
    margin-left: 10px;
    padding: 12px 18px;
    border-radius: 25px;
    border: none;
    background: #7ee9ff;
    color: #0f2027;
    cursor: pointer;
    font-weight: bold;
  }

  /* Scrollbar */
  .messages::-webkit-scrollbar {
    width: 6px;
  }
  .messages::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
  }

  .badge {
    background: #ff4757;
    color: white;
    border-radius: 50%;
    padding: 2px 6px;
    font-size: 10px;
    position: absolute;
    top: -5px;
    right: -5px;
    min-width: 18px;
    text-align: center;
  }

  .conversation {
    position: relative;
  }

</style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>WINGS 🪽</h2>
    <div id="conversations"></div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area">
    <div class="chat-header">
      <img id="chatAvatar" src="https://i.pravatar.cc/50?img=1" alt="Avatar">
      <div class="name" id="chatName">Alice</div>
    </div>
    <div class="messages" id="messages">
      <div class="message received">Hey! How are you?</div>
      <div class="message sent">I'm good, thanks! How about you?</div>
    </div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Type a message...">
      <button type="button" id="sendBtn">Send</button>
    </div>
  </div>

<script>
  const conversationsEl = document.getElementById('conversations');
  const chatName = document.getElementById('chatName');
  const chatAvatar = document.getElementById('chatAvatar');
  const messagesEl = document.getElementById('messages');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');

  const currentUsername = localStorage.getItem('currentUsername') || 'divyansh_srivastav';
  let currentChatUser = null;

  // Load users from database
  function loadUsers() {
    console.log('Loading users from /api/auth/users');
    fetch('/api/auth/users')
      .then(res => {
        console.log('Users fetch response status:', res.status);
        if (!res.ok) throw new Error('Failed to fetch users');
        return res.json();
      })
      .then(users => {
        console.log('Loaded users:', users);
        conversationsEl.innerHTML = '';
        users.forEach(user => {
          if (user.username === currentUsername) return; // Don't show self
          const convDiv = document.createElement('div');
          convDiv.classList.add('conversation');
          convDiv.dataset.name = user.username;
          convDiv.innerHTML = `
            <img src="https://i.pravatar.cc/50?img=${Math.floor(Math.random()*10)+1}" alt="${user.username}">
            <div>
              <div class="name">${user.username}</div>
              <div class="lastMsg">Click to chat</div>
            </div>
          `;
          conversationsEl.appendChild(convDiv);
        });
        // Add click listeners
        document.querySelectorAll('.conversation').forEach(conv => {
          conv.addEventListener('click', () => {
            document.querySelectorAll('.conversation').forEach(c => c.classList.remove('active'));
            conv.classList.add('active');
            currentChatUser = conv.dataset.name;
            chatName.textContent = conv.querySelector('.name').textContent;
            chatAvatar.src = conv.querySelector('img').src;
            loadMessages(currentChatUser);
          });
        });
      })
      .catch(err => {
        console.error('Error loading users:', err);
        conversationsEl.innerHTML = '<div style="padding: 20px; color: red;">Failed to load users. Ensure backend is running and MongoDB is connected.</div>';
      });
  }

  // Load messages between current user and selected user
  function loadMessages(otherUser) {
    console.log(`Loading messages between ${currentUsername} and ${otherUser}`);
    fetch(`/api/messages/${currentUsername}/${otherUser}`)
      .then(res => {
        console.log('Messages fetch response status:', res.status);
        if (!res.ok) throw new Error('Failed to fetch messages');
        return res.json();
      })
      .then(messages => {
        console.log('Loaded messages:', messages);
        messagesEl.innerHTML = '';
        messages.forEach(msg => {
          const msgDiv = document.createElement('div');
          msgDiv.classList.add('message', msg.sender === currentUsername ? 'sent' : 'received');
          msgDiv.textContent = msg.content;
          messagesEl.appendChild(msgDiv);
        });
        messagesEl.scrollTop = messagesEl.scrollHeight;
      })
      .catch(err => {
        console.error('Error loading messages:', err);
        messagesEl.innerHTML = '<div style="padding: 20px; color: red;">Failed to load messages.</div>';
      });
  }

  // Send message
  function sendMessage() {
    const text = msgInput.value.trim();
    if (text === '' || !currentChatUser) {
      alert('Please select a user to chat with first.');
      return;
    }
    console.log('Sending message:', { sender: currentUsername, recipient: currentChatUser, content: text });
    fetch('/api/messages/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sender: currentUsername, recipient: currentChatUser, content: text })
    })
    .then(res => {
      console.log('Send message response status:', res.status);
      if (!res.ok) throw new Error('Failed to send message');
      return res.json();
    })
    .then(data => {
      console.log('Send message response:', data);
      msgInput.value = '';
      loadMessages(currentChatUser);
    })
    .catch(err => {
      console.error('Error sending message:', err);
      alert('Failed to send message.');
    });
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  // Load on page load
  loadUsers();
</script>

</body>
<div id="wings-chatbot">
<style>
#chatbot-toggle {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, #6ed6c3, #b48efa, #ffb28b);
  color: white;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  font-size: 24px;
  z-index: 1000;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  transition: transform 0.3s ease;
}
#chatbot-toggle:hover {
  transform: scale(1.1);
}
#chat-window {
  display: none;
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 350px;
  height: 500px;
  background-color: white;
  border: 1px solid #ccc;
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(0,0,0,0.2);
  z-index: 1000;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}
#chat-window.dark {
  background-color: #2c2c2c;
  color: white;
  border-color: #555;
}
#chat-header {
  background: linear-gradient(135deg, #6ed6c3, #b48efa);
  color: white;
  padding: 10px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
}
#close-chat {
  background: none;
  border: none;
  color: white;
  font-size: 20px;
  cursor: pointer;
}
#chat-messages {
  height: 300px;
  overflow-y: auto;
  padding: 10px;
  background: #f9f9f9;
}
#chat-window.dark #chat-messages {
  background: #1e1e1e;
}
.message {
  margin-bottom: 10px;
  padding: 8px 12px;
  border-radius: 10px;
  max-width: 80%;
}
.message.user {
  background: #007bff;
  color: white;
  margin-left: auto;
  text-align: right;
}
.message.bot {
  background: #e9ecef;
  color: #333;
}
#chat-window.dark .message.bot {
  background: #444;
  color: white;
}
#quick-actions {
  padding: 10px;
  border-top: 1px solid #ccc;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
#chat-window.dark #quick-actions {
  border-color: #555;
}
.quick-btn {
  background: #6ed6c3;
  color: white;
  border: none;
  padding: 5px 10px;
  border-radius: 15px;
  cursor: pointer;
  font-size: 12px;
  transition: background 0.3s;
}
.quick-btn:hover {
  background: #56b9a8;
}
#chat-input-area {
  display: flex;
  border-top: 1px solid #ccc;
}
#chat-window.dark #chat-input-area {
  border-color: #555;
}
#chat-input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
  background: white;
}
#chat-window.dark #chat-input {
  background: #2c2c2c;
  color: white;
}
#send-btn {
  background: #007bff;
  color: white;
  border: none;
  padding: 10px 15px;
  cursor: pointer;
  transition: background 0.3s;
}
#send-btn:hover {
  background: #0056b3;
}
.typing {
  font-style: italic;
  color: #666;
}
#chat-window.dark .typing {
  color: #ccc;
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const toggle = document.getElementById('chatbot-toggle');
  const windowEl = document.getElementById('chat-window');
  const closeBtn = document.getElementById('close-chat');
  const messagesEl = document.getElementById('chat-messages');
  const inputEl = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const quickActions = document.getElementById('quick-actions');

  let chatHistory = JSON.parse(localStorage.getItem('wingsChatHistory')) || [];
  let isDark = document.body.classList.contains('dark');

  // Load history
  function loadHistory() {
    messagesEl.innerHTML = '';
    chatHistory.forEach(msg => {
      addMessage(msg.text, msg.sender);
    });
  }

  // Save history
  function saveHistory() {
    localStorage.setItem('wingsChatHistory', JSON.stringify(chatHistory));
  }

  // Add message
  function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    msgDiv.textContent = text;
    messagesEl.appendChild(msgDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // Bot responses
  const responses = {
    'hello': 'Hi there! How can I help you with Wings?',
    'hi': 'Hello! Welcome to Wings. What would you like to know?',
    'how to post': 'To post, click the + icon in the sidebar, select a photo/video, add a caption, and post!',
    'explore': 'navigate:explore.html',
    'profile': 'navigate:profile.html',
    'message': 'navigate:message.html',
    'reel': 'navigate:reels.html',
    'story': 'navigate:home.html', // assuming stories are on home
    'dark mode': 'Toggle dark mode using the moon icon in the top right navbar.',
    'help': 'I can help with: posting, exploring, messaging, reels, stories, profile, dark mode, and more!',
    'default': 'Sorry, I didn\'t understand that. Try asking about posting, exploring, or other features!'
  };

  function getResponse(message) {
    const lowerMsg = message.toLowerCase();
    for (let key in responses) {
      if (lowerMsg.includes(key)) {
        return responses[key];
      }
    }
    return responses['default'];
  }

  // Send message
  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    chatHistory.push({ text, sender: 'user' });
    inputEl.value = '';

    // Typing indicator
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message bot typing';
    typingDiv.textContent = 'Typing...';
    messagesEl.appendChild(typingDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    setTimeout(() => {
      const response = getResponse(text);
      if (response.startsWith('navigate:')) {
        typingDiv.remove();
        const page = response.split(':')[1];
        window.location.href = page;
      } else {
        typingDiv.remove();
        addMessage(response, 'bot');
        chatHistory.push({ text: response, sender: 'bot' });
        saveHistory();
      }
    }, 1000);
  }

  // Quick actions
  quickActions.addEventListener('click', (e) => {
    if (e.target.classList.contains('quick-btn')) {
      const question = e.target.textContent;
      inputEl.value = question;
      sendMessage();
    }
  });

  // Event listeners
  toggle.addEventListener('click', () => {
    windowEl.style.display = windowEl.style.display === 'none' ? 'block' : 'none';
    if (windowEl.style.display === 'block') {
      loadHistory();
      inputEl.focus();
    }
  });

  closeBtn.addEventListener('click', () => {
    windowEl.style.display = 'none';
  });

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // Dark mode sync
  function updateDarkMode() {
    isDark = document.body.classList.contains('dark');
    windowEl.classList.toggle('dark', isDark);
  }
  updateDarkMode();
  // Listen for dark mode changes (assuming toggleDarkMode is global)
  if (typeof toggleDarkMode === 'function') {
    const originalToggle = toggleDarkMode;
    toggleDarkMode = function() {
      originalToggle();
      updateDarkMode();
    };
  }

  // Initial greeting if no history
  if (chatHistory.length === 0) {
    addMessage('Hi! I\'m Wings Chatbot. How can I assist you today?', 'bot');
    chatHistory.push({ text: 'Hi! I\'m Wings Chatbot. How can I assist you today?', sender: 'bot' });
    saveHistory();
  }
});
</script>
<button id="chatbot-toggle">💬</button>
<div id="chat-window">
  <div id="chat-header">
    Wings Chatbot
    <button id="close-chat">×</button>
  </div>
  <div id="chat-messages"></div>
  <div id="quick-actions">
    <button class="quick-btn">How to post?</button>
    <button class="quick-btn">Explore features</button>
    <button class="quick-btn">My profile</button>
    <button class="quick-btn">Send message</button>
    <button class="quick-btn">Watch reels</button>
    <button class="quick-btn">Add story</button>
  </div>
  <div id="chat-input-area">
    <input type="text" id="chat-input" placeholder="Type your message...">
    <button type="button" id="send-btn">Send</button>
  </div>
</div>
</div>
</html>
