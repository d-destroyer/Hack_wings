<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WINGS 🪽 | Notifications</title>
<style>
  :root {
    --teal: #6ed6c3;
    --lavender: #b48efa;
    --peach: #ffb28b;
    --charcoal: #1f1f1f;
    --bg: #f9fafb;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", sans-serif; }
  body {
    background: url("assets/background.jpg") center/cover no-repeat fixed;
    color: var(--charcoal);
    min-height:100vh;
    transition: background 0.5s ease;
  }

  body.dark {
    background: linear-gradient(135deg, #0f0f0f, #1a1a1a) fixed;
  }

  header {
    width:100%; background:rgba(255,255,255,0.8);
    backdrop-filter: blur(8px);
    padding:12px 20px; display:flex; justify-content:space-between; align-items:center;
    position:sticky; top:0; z-index:10; border-bottom:1px solid #ddd;
  }
  header .logo {font-size:24px; font-weight:700;}
  header .nav-icons {display:flex; gap:18px;}
  header .nav-icons img {width:22px; cursor:pointer; transition:transform 0.2s;}
  header .nav-icons img:hover {transform:scale(1.2);}

  .container {
    display: flex;
    justify-content: center;
    padding: 2rem;
    margin-left: 90px;
    transition: margin-left 0.5s ease;
  }
  .navbar:hover ~ .container {
    margin-left: 220px;
  }

  .notification-panel {
    width: 100%;
    max-width: 500px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .panel-header {
    background: linear-gradient(135deg, var(--teal), var(--lavender));
    color: #fff;
    padding: 1rem 1.5rem;
    font-size: 1.4rem;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .notification-list {
    max-height: 480px;
    overflow-y: auto;
  }

  .notification {
    display: flex;
    align-items: flex-start;
    gap: 0.8rem;
    padding: 1rem 1.2rem;
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.3s;
    animation: fadeIn 0.4s ease;
  }

  .notification:hover {
    background: #f9f9ff;
  }

  .notif-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--lavender);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 1.2rem;
    flex-shrink: 0;
  }

  .notification.read .notif-icon {
    opacity: 0.5;
  }

  .notif-content {
    flex: 1;
  }

  .notif-content p {
    font-size: 0.95rem;
    margin-bottom: 0.3rem;
  }

  .notif-time {
    font-size: 0.8rem;
    color: gray;
  }

  .notif-actions {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .notif-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--teal);
    font-size: 0.85rem;
    transition: 0.2s;
  }

  .notif-btn:hover {
    color: var(--lavender);
  }

  .empty {
    text-align: center;
    padding: 2rem;
    color: gray;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* --- NAVBAR BASE --- */
  .navbar {
    position: fixed;
    left: 0;
    top: 0;
    width: 90px;
    height: 100%;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(15px);
    box-shadow: 2px 0 15px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 25px;
    transition: all 0.5s ease;
    overflow: hidden;
    z-index: 10;
  }

  /* --- BACKGROUND IMAGE ON HOVER --- */
  .navbar::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url("assets/temp_image_1760002423274.jpeg") center/cover no-repeat;
    opacity: 0;
    transform: scale(1.1) translateX(var(--mx)) translateY(var(--my));
    transition: opacity 0.5s ease, transform 0.3s ease;
    z-index: -1;
  }

  .navbar:hover {
    width: 220px;
  }

  .navbar:hover::before {
    opacity: 1;
    transform: scale(1) translateX(var(--mx)) translateY(var(--my));
  }

  .side-navbar.dark {
    background: rgba(26, 26, 26, 0.95) !important;
  }

  .side-navbar.dark::before {
    opacity: 0 !important;
  }

  /* --- NAV ITEMS --- */
  .nav-item {
    width: 85%;
    margin: 0;
    padding: 6px;
    display: flex;
    align-items: center;
    gap: 9px;
    border-radius: 12px;
    color: #333;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .nav-item i {
    font-size: 1.4rem;
    min-width: 30px;
    text-align: center;
    color: #fff;
  }
  .nav-item span {
    opacity: 0;
    transform: translateX(-10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    white-space: nowrap;
    font-weight: bold;
    color: #fff;
  }
  .navbar:hover .nav-item span {
    opacity: 1;
    transform: translateX(0);
  }
  .nav-item:hover {
    background: linear-gradient(135deg, #ffb28b, #b48efa, #6ed6c3);
    color: #fff;
    box-shadow: 0 0 20px rgba(180,142,250,0.6), 0 0 40px rgba(110,214,195,0.3);
    transform: translateX(8px);
  }
  .nav-item.active {
    background: linear-gradient(135deg, #ffb28b, #b48efa, #6ed6c3);
    color: #fff;
  }

  /* --- RIGHT NAVBAR --- */
  .right-navbar {
    position: fixed;
    right: 0;
    top: 0;
    width: 90px;
    height: 100%;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(15px);
    box-shadow: -2px 0 15px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 25px;
    transition: all 0.5s ease;
    overflow: hidden;
    z-index: 10;
  }

  /* --- BACKGROUND IMAGE ON HOVER --- */
  .right-navbar::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url("assets/temp_image_1760002423274.jpeg") center/cover no-repeat;
    opacity: 0;
    transform: scale(1.1) translateX(var(--mx)) translateY(var(--my));
    transition: opacity 0.5s ease, transform 0.3s ease;
    z-index: -1;
  }

  .right-navbar:hover {
    width: 220px;
  }

  .right-navbar:hover::before {
    opacity: 1;
    transform: scale(1) translateX(var(--mx)) translateY(var(--my));
  }

  .right-navbar.dark {
    background: rgba(26, 26, 26, 0.95) !important;
  }

  .right-navbar.dark::before {
    opacity: 0 !important;
  }

  .right-navbar .nav-item {
    width: 85%;
    margin: 0;
    padding: 6px;
    display: flex;
    align-items: center;
    gap: 9px;
    border-radius: 12px;
    color: #333;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .right-navbar .nav-item i {
    font-size: 1.4rem;
    min-width: 30px;
    text-align: center;
    color: #fff;
  }

  .right-navbar .nav-item span {
    opacity: 0;
    transform: translateX(-10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    white-space: nowrap;
    font-weight: bold;
    color: #fff;
  }

  .right-navbar:hover .nav-item span {
    opacity: 1;
    transform: translateX(0);
  }

  .right-navbar .nav-item:hover {
    background: linear-gradient(135deg, #ffb28b, #b48efa, #6ed6c3);
    color: #fff;
    box-shadow: 0 0 20px rgba(180,142,250,0.6), 0 0 40px rgba(110,214,195,0.3);
    transform: translateX(-8px);
  }

  .badge {
    background: #ff4757;
    color: white;
    border-radius: 50%;
    padding: 2px 6px;
    font-size: 10px;
    position: absolute;
    top: -5px;
    right: -5px;
    min-width: 18px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div class="navbar">
    <div class="logo">WINGS 🪽</div>
    <div class="search-box">
      🔍 <input type="text" placeholder="Search..." id="searchInput" />
    </div>
    <div class="nav-icons">
      <img src="https://img.icons8.com/ios/50/home.png" onclick="window.location.href='home.html'" />
      <img src="https://img.icons8.com/ios/50/sent.png" onclick="window.location.href='message.html'" />
      <img id="themeToggle" src="https://img.icons8.com/ios/50/moon-symbol.png" title="Toggle Dark Mode"/>
      <img src="https://img.icons8.com/ios/50/like--v1.png" onclick="window.location.href='noti.html'" />
    </div>
  </div>
</header>

<!-- NAVBAR -->
<div class="navbar side-navbar">
  <div class="nav-item" onclick="window.location.href='home.html'">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </div>
  <div class="nav-item" onclick="window.location.href='explore.html'">
    <i class="fa-solid fa-compass"></i>
    <span>Explore</span>
  </div>
  <div class="nav-item" onclick="window.location.href='reels.html'">
    <i class="fa-solid fa-clapperboard"></i>
    <span>Reels</span>
  </div>
  <div class="nav-item" onclick="window.location.href='message.html'">
    <i class="fa-solid fa-message"></i>
    <span>Messages</span>
  </div>
  <div class="nav-item" onclick="window.location.href='noti.html'" class="active">
    <i class="fa-solid fa-bell"></i>
    <span>Notifications</span>
  </div>
  <div class="nav-item" onclick="window.location.href='profile.html'">
    <i class="fa-solid fa-user"></i>
    <span>Profile</span>
  </div>
</div>

<div class="right-navbar">
  <div class="nav-item" onclick="window.location.href='noti.html'">
    <i class="fa-solid fa-bell"></i>
    <span>Notifications</span>
    <span id="notificationBadge" class="badge" style="display:none;"></span>
  </div>
  <div class="nav-item" onclick="window.location.href='login.html'">
    <i class="fa-solid fa-right-from-bracket"></i>
    <span>Log Out</span>
  </div>
  <div class="nav-item" onclick="toggleDarkMode()">
    <i class="fa-solid fa-moon"></i>
    <span>Dark Mode</span>
  </div>
</div>

<div class="container">
  <div class="notification-panel">
    <div class="panel-header">
      <span>Notifications</span>
      <button id="clearAll" class="notif-btn" style="color:#fff;">Clear All</button>
    </div>
    <div class="notification-list" id="notifList"></div>
  </div>
</div>

<script>
const notifList = document.getElementById("notifList");
const clearAllBtn = document.getElementById("clearAll");

let currentUsername = localStorage.getItem('currentUsername') || 'divyansh_srivastav';
let notifications = [];

function getIcon(type) {
  switch (type) {
    case "like": return "❤️";
    case "comment": return "💬";
    case "follow": return "🪽";
    case "system": return "⚙️";
    default: return "🔔";
  }
}

function renderNotifs() {
  if (notifications.length === 0) {
    notifList.innerHTML = `<div class='empty'>You're all caught up! ✨</div>`;
    return;
  }

  notifList.innerHTML = notifications.map(n => `
    <div class="notification ${n.read ? 'read' : ''}" id="notif-${n._id}">
      <div class="notif-icon">${getIcon(n.type)}</div>
      <div class="notif-content">
        <p>${n.message}</p>
        <div class="notif-time">${new Date(n.timestamp).toLocaleString()}</div>
      </div>
      <div class="notif-actions">
        ${!n.read ? `<button class="notif-btn" onclick="markRead('${n._id}')">Mark Read</button>` : ''}
        <button class="notif-btn" onclick="deleteNotif('${n._id}')">Dismiss</button>
      </div>
    </div>
  `).join('');
}

function markRead(id) {
  fetch(`/api/notifications/${id}/read`, { method: 'PUT' })
    .then(() => loadNotifications())
    .catch(err => console.error('Error marking read:', err));
}

function deleteNotif(id) {
  // For now, just mark as read, or implement delete if needed
  markRead(id);
}

function loadNotifications() {
  fetch(`/api/notifications/${currentUsername}`)
    .then(res => res.json())
    .then(data => {
      notifications = data;
      renderNotifs();
      // Update badge
      const unreadCount = data.filter(n => !n.read).length;
      const badge = document.getElementById('notificationBadge');
      if (unreadCount > 0) {
        badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
        badge.style.display = 'inline';
      } else {
        badge.style.display = 'none';
      }
    })
    .catch(err => console.error('Error loading notifications:', err));
}

clearAllBtn.addEventListener("click", () => {
  fetch(`/api/notifications/${currentUsername}/read`, { method: 'PUT' })
    .then(() => loadNotifications())
    .catch(err => console.error('Error clearing notifications:', err));
});

loadNotifications();

// --- NAVBAR SCRIPTS ---
const navbar = document.querySelector('.side-navbar');
if (navbar) {
  navbar.addEventListener('mousemove', e => {
    const rect = navbar.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width - 0.5) * 20;
    const my = ((e.clientY - rect.top) / rect.height - 0.5) * 20;
    navbar.style.setProperty('--mx', mx + 'px');
    navbar.style.setProperty('--my', my + 'px');
  });
  navbar.addEventListener('mouseleave', () => {
    navbar.style.setProperty('--mx', '0px');
    navbar.style.setProperty('--my', '0px');
  });
}

const rightNavbar = document.querySelector('.right-navbar');
if (rightNavbar) {
  rightNavbar.addEventListener('mousemove', e => {
    const rect = rightNavbar.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width - 0.5) * 20;
    const my = ((e.clientY - rect.top) / rect.height - 0.5) * 20;
    rightNavbar.style.setProperty('--mx', mx + 'px');
    rightNavbar.style.setProperty('--my', my + 'px');
  });
  rightNavbar.addEventListener('mouseleave', () => {
    rightNavbar.style.setProperty('--mx', '0px');
    rightNavbar.style.setProperty('--my', '0px');
  });
}

// --- DARK MODE ---
let dark = false;
function toggleDarkMode() {
  dark = !dark;
  document.body.classList.toggle('dark', dark);
  document.querySelector('.side-navbar').classList.toggle('dark', dark);
  document.querySelector('.right-navbar').classList.toggle('dark', dark);
  const toggle = document.getElementById("themeToggle");
  if (toggle) {
    toggle.src = dark
      ? "https://img.icons8.com/ios/50/sun--v1.png"
      : "https://img.icons8.com/ios/50/moon-symbol.png";
  }
  const moonIcon = document.querySelector('.right-navbar .nav-item:nth-child(3) i');
  if (moonIcon) {
    moonIcon.className = dark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  }
}
const toggle = document.getElementById("themeToggle");
if (toggle) {
  toggle.onclick = toggleDarkMode;
}

// Screenshot detection
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    fetch('/api/notifications/screenshot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ from: currentUsername })
    }).catch(err => console.error('Error recording screenshot:', err));
  }
});

// Screenshot popup check
let lastScreenshotTime = 0;
function checkScreenshots() {
  fetch('/api/notifications/screenshot/latest')
    .then(res => res.json())
    .then(data => {
      if (data && new Date(data.timestamp).getTime() > lastScreenshotTime) {
        alert(`${data.from} took a screenshot!`);
        lastScreenshotTime = new Date(data.timestamp).getTime();
      }
    })
    .catch(err => console.error('Error checking screenshots:', err));
}
setInterval(checkScreenshots, 1000);
</script>

</body>
<div id="wings-chatbot">
<style>
#chatbot-toggle {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, #6ed6c3, #b48efa, #ffb28b);
  color: white;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  font-size: 24px;
  z-index: 1000;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  transition: transform 0.3s ease;
}
#chatbot-toggle:hover {
  transform: scale(1.1);
}
#chat-window {
  display: none;
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 350px;
  height: 500px;
  background-color: white;
  border: 1px solid #ccc;
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(0,0,0,0.2);
  z-index: 1000;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}
#chat-window.dark {
  background-color: #2c2c2c;
  color: white;
  border-color: #555;
}
#chat-header {
  background: linear-gradient(135deg, #6ed6c3, #b48efa);
  color: white;
  padding: 10px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
}
#close-chat {
  background: none;
  border: none;
  color: white;
  font-size: 20px;
  cursor: pointer;
}
#chat-messages {
  height: 300px;
  overflow-y: auto;
  padding: 10px;
  background: #f9f9f9;
}
#chat-window.dark #chat-messages {
  background: #1e1e1e;
}
.message {
  margin-bottom: 10px;
  padding: 8px 12px;
  border-radius: 10px;
  max-width: 80%;
}
.message.user {
  background: #007bff;
  color: white;
  margin-left: auto;
  text-align: right;
}
.message.bot {
  background: #e9ecef;
  color: #333;
}
#chat-window.dark .message.bot {
  background: #444;
  color: white;
}
#quick-actions {
  padding: 10px;
  border-top: 1px solid #ccc;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
#chat-window.dark #quick-actions {
  border-color: #555;
}
.quick-btn {
  background: #6ed6c3;
  color: white;
  border: none;
  padding: 5px 10px;
  border-radius: 15px;
  cursor: pointer;
  font-size: 12px;
  transition: background 0.3s;
}
.quick-btn:hover {
  background: #56b9a8;
}
#chat-input-area {
  display: flex;
  border-top: 1px solid #ccc;
}
#chat-window.dark #chat-input-area {
  border-color: #555;
}
#chat-input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
  background: white;
}
#chat-window.dark #chat-input {
  background: #2c2c2c;
  color: white;
}
#send-btn {
  background: #007bff;
  color: white;
  border: none;
  padding: 10px 15px;
  cursor: pointer;
  transition: background 0.3s;
}
#send-btn:hover {
  background: #0056b3;
}
.typing {
  font-style: italic;
  color: #666;
}
#chat-window.dark .typing {
  color: #ccc;
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const toggle = document.getElementById('chatbot-toggle');
  const windowEl = document.getElementById('chat-window');
  const closeBtn = document.getElementById('close-chat');
  const messagesEl = document.getElementById('chat-messages');
  const inputEl = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const quickActions = document.getElementById('quick-actions');

  let chatHistory = JSON.parse(localStorage.getItem('wingsChatHistory')) || [];
  let isDark = document.body.classList.contains('dark');

  // Load history
  function loadHistory() {
    messagesEl.innerHTML = '';
    chatHistory.forEach(msg => {
      addMessage(msg.text, msg.sender);
    });
  }

  // Save history
  function saveHistory() {
    localStorage.setItem('wingsChatHistory', JSON.stringify(chatHistory));
  }

  // Add message
  function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    msgDiv.textContent = text;
    messagesEl.appendChild(msgDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // Bot responses
  const responses = {
    'hello': 'Hi there! How can I help you with Wings?',
    'hi': 'Hello! Welcome to Wings. What would you like to know?',
    'how to post': 'To post, click the + icon in the sidebar, select a photo/video, add a caption, and post!',
    'explore': 'navigate:explore.html',
    'profile': 'navigate:profile.html',
    'message': 'navigate:message.html',
    'reel': 'navigate:reels.html',
    'story': 'navigate:home.html', // assuming stories are on home
    'dark mode': 'Toggle dark mode using the moon icon in the top right navbar.',
    'help': 'I can help with: posting, exploring, messaging, reels, stories, profile, dark mode, and more!',
    'default': 'Sorry, I didn\'t understand that. Try asking about posting, exploring, or other features!'
  };

  function getResponse(message) {
    const lowerMsg = message.toLowerCase();
    for (let key in responses) {
      if (lowerMsg.includes(key)) {
        return responses[key];
      }
    }
    return responses['default'];
  }

  // Send message
  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    chatHistory.push({ text, sender: 'user' });
    inputEl.value = '';

    // Typing indicator
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message bot typing';
    typingDiv.textContent = 'Typing...';
    messagesEl.appendChild(typingDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    setTimeout(() => {
      const response = getResponse(text);
      if (response.startsWith('navigate:')) {
        typingDiv.remove();
        const page = response.split(':')[1];
        window.location.href = page;
      } else {
        typingDiv.remove();
        addMessage(response, 'bot');
        chatHistory.push({ text: response, sender: 'bot' });
        saveHistory();
      }
    }, 1000);
  }

  // Quick actions
  quickActions.addEventListener('click', (e) => {
    if (e.target.classList.contains('quick-btn')) {
      const question = e.target.textContent;
      if (question === 'Watch reels') {
        window.location.href = 'reels.html';
      } else if (question === 'Explore features') {
        window.location.href = 'explore.html';
      } else if (question === 'My profile') {
        window.location.href = 'profile.html';
      } else if (question === 'Send message') {
        window.location.href = 'message.html';
      } else if (question === 'Add story') {
        window.location.href = 'home.html';
      } else {
        inputEl.value = question;
        sendMessage();
      }
    }
  });

  // Event listeners
  toggle.addEventListener('click', () => {
    windowEl.style.display = windowEl.style.display === 'none' ? 'block' : 'none';
    if (windowEl.style.display === 'block') {
      loadHistory();
      inputEl.focus();
    }
  });

  closeBtn.addEventListener('click', () => {
    windowEl.style.display = 'none';
  });

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // Dark mode sync
  function updateDarkMode() {
    isDark = document.body.classList.contains('dark');
    windowEl.classList.toggle('dark', isDark);
  }
  updateDarkMode();
  // Listen for dark mode changes (assuming toggleDarkMode is global)
  if (typeof toggleDarkMode === 'function') {
    const originalToggle = toggleDarkMode;
    toggleDarkMode = function() {
      originalToggle();
      updateDarkMode();
    };
  }

  // Initial greeting if no history
  if (chatHistory.length === 0) {
    addMessage('Hi! I\'m Wings Chatbot. How can I assist you today?', 'bot');
    chatHistory.push({ text: 'Hi! I\'m Wings Chatbot. How can I assist you today?', sender: 'bot' });
    saveHistory();
  }
});
</script>
<button id="chatbot-toggle">💬</button>

  <div id="chat-header">
    Wings Chatbot
    <button id="close-chat">×</button>
  </div>
  <div id="chat-messages"></div>
  <div id="quick-actions">
    <button class="quick-btn">How to post?</button>
    <button class="quick-btn">Explore features</button>
    <button class="quick-btn">My profile</button>
    <button class="quick-btn">Send message</button>
    <button class="quick-btn">Watch reels</button>
    <button class="quick-btn">Add story</button>
  </div>
  <div id="chat-input-area">
    <input type="text" id="chat-input" placeholder="Type your message...">
    <button id="send-btn">Send</button>
  </div>
</div>
</div>
</html>
